name: CI

# The core, the compile-error cases, the adapters that need no service
# (csv, yaml, sql) and the examples. zom-pg is built with -Dpg=false, so this
# workflow neither fetches pg.zig nor needs Postgres; zom-pg has its own
# workflow, pg.yml, so a Postgres problem never fails a core run.
# zom-tigerbeetle is built and its offline tests run (it fetches the prebuilt
# C client); its cluster test skips without ZOM_TB_ADDRESSES.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          # Cached below instead: the examples are separate builds, each
          # with its own .zig-cache.
          use-cache: false

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            examples/*/.zig-cache
          key: core-zig-0.16.0-${{ runner.os }}-${{ hashFiles('**/build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            core-zig-0.16.0-${{ runner.os }}-${{ hashFiles('**/build.zig.zon') }}-
            core-zig-0.16.0-${{ runner.os }}-

      # Fetched packages under zig-pkg are not ours to format.
      - name: zig fmt --check
        run: zig fmt --check --exclude zig-pkg .

      - name: zig build test
        run: zig build test -Dpg=false --summary all
