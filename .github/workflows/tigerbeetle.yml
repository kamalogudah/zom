name: zom-tigerbeetle

# zom-tigerbeetle's tests against a single-replica TigerBeetle dev cluster,
# then examples/double_entry against the same cluster. Kept apart from
# ci.yml, as pg.yml is, so a TigerBeetle problem never fails a core run.
#
# The server is the release binary, pinned to the version of the C client in
# build.zig.zon (tigerbeetle-go v0.17.9), and checked against its SHA-256.
# To move both, change TB_VERSION and TB_SHA256 here and the tigerbeetle_go
# entry there (adapters/tigerbeetle/README.md, "How the client is fetched").

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tigerbeetle-${{ github.ref }}
  cancel-in-progress: true

env:
  TB_VERSION: 0.17.9
  TB_SHA256: af71f2c0057e3b409bf79940fa94894b738187b0d4f1e711097bca15df5d8cd4
  TB_PORT: "3000"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.1
          use-cache: false

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-pkg
            examples/double_entry/.zig-cache
            examples/double_entry/zig-pkg
          key: tb-zig-0.17.1-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            tb-zig-0.17.1-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}-
            tb-zig-0.17.1-${{ runner.os }}-

      - name: Install TigerBeetle ${{ env.TB_VERSION }}
        shell: bash
        run: |
          dir="$RUNNER_TEMP/tigerbeetle"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/tb.zip" \
            "https://github.com/tigerbeetle/tigerbeetle/releases/download/$TB_VERSION/tigerbeetle-x86_64-linux.zip"
          echo "$TB_SHA256  $dir/tb.zip" | sha256sum -c -
          unzip -q "$dir/tb.zip" -d "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/tigerbeetle" version

      # --development lowers the request limit to 253 events and skips the
      # production checks (direct I/O, memory), which a runner can't meet.
      # The tests pass on either kind of cluster.
      - name: Start a dev cluster
        shell: bash
        run: |
          data="$RUNNER_TEMP/0_0.tigerbeetle"
          tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development "$data"
          nohup tigerbeetle start --addresses="$TB_PORT" --development "$data" \
            > "$RUNNER_TEMP/tigerbeetle.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tigerbeetle.pid"
          for _ in $(seq 1 60); do
            if (exec 3<>"/dev/tcp/127.0.0.1/$TB_PORT") 2>/dev/null; then
              echo "listening on $TB_PORT"
              exit 0
            fi
            kill -0 "$(cat "$RUNNER_TEMP/tigerbeetle.pid")" || { cat "$RUNNER_TEMP/tigerbeetle.log"; exit 1; }
            sleep 1
          done
          echo "::error::tigerbeetle didn't listen on $TB_PORT in 60s"
          cat "$RUNNER_TEMP/tigerbeetle.log"
          exit 1

      # The adapter's offline tests, its compile-error cases, and the cluster
      # tests (including "lint read checks"). A cluster test that can't see
      # ZOM_TB_ADDRESSES is skipped, not failed; here, a skip means it didn't
      # reach the cluster, so fail on it. zom.lint's update and delete
      # checks must show as skipped: records are immutable.
      - name: zig build test-tigerbeetle (against the cluster)
        env:
          ZOM_TB_ADDRESSES: ${{ env.TB_PORT }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/tb-test.log"
          zig build test-tigerbeetle -Dpg=false --summary all 2>&1 | tee "$log"
          if grep -Eq 'test zom_tigerbeetle .*[0-9]+ skip' "$log"; then
            echo "::error::zom-tigerbeetle cluster tests were skipped; is ZOM_TB_ADDRESSES reaching them?"
            exit 1
          fi
          for dataset in accounts transfers; do
            for check in update delete; do
              if ! grep -q "zom.lint \[tigerbeetle\]: skipped on '$dataset': $check:" "$log"; then
                echo "::error::zom.lint didn't report its $check check as skipped on $dataset"
                exit 1
              fi
            done
          done

      # Two accounts, transfers (one linked chain posted, one refused) and
      # the balances, through zom only. `test` checks the output
      # (examples/double_entry/build.zig); `run` prints it in the log.
      - name: examples/double_entry (against the cluster)
        working-directory: examples/double_entry
        env:
          TB_ADDRESSES: ${{ env.TB_PORT }}
        run: |
          zig build test --summary all
          zig build run

      - name: TigerBeetle log
        if: failure()
        run: cat "$RUNNER_TEMP/tigerbeetle.log" || true
